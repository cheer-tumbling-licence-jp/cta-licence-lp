<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜タンブリング指導ライセンス</title>
<meta name="description" content="お探しのページは見つかりませんでした。">
<meta name="theme-color" content="#0a2647">
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@700;900&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#0a2647;--navy-deep:#061a36;--gold:#c9a247;--gold-light:#e7c97a;
  --paper:#fbf9f4;--ink:#1a1a1a;--ink-soft:#4a4a4a;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  font-family:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  background:linear-gradient(135deg,var(--navy-deep),var(--navy));
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  text-align:center;padding:32px;
  font-feature-settings:"palt";
}
.wrap{max-width:560px}
.code{
  font-family:"Cormorant Garamond","Noto Serif JP",serif;
  font-size:clamp(80px,18vw,160px);font-weight:600;
  color:var(--gold-light);line-height:1;margin:0 0 8px;
  letter-spacing:.04em;
}
.label{
  font-family:"Cormorant Garamond",serif;
  letter-spacing:.32em;font-size:13px;color:var(--gold);
  margin:0 0 32px;
}
.label::before,.label::after{
  content:"";display:inline-block;width:24px;height:1px;
  background:var(--gold);vertical-align:middle;margin:0 12px;
}
h1{
  font-family:"Noto Serif JP",serif;
  font-weight:900;font-size:clamp(22px,3.4vw,32px);
  margin:0 0 18px;letter-spacing:.04em;line-height:1.5;
}
p{
  font-size:15px;line-height:2;color:rgba(255,255,255,.85);
  margin:0 0 36px;
}
.btn{
  display:inline-block;
  background:var(--gold);color:var(--navy-deep);
  padding:16px 36px;border-radius:4px;text-decoration:none;
  font-weight:700;letter-spacing:.06em;font-size:15px;
  box-shadow:0 4px 18px rgba(201,162,71,.35);
  transition:transform .15s, box-shadow .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,162,71,.5)}
.divider{width:60px;height:1px;background:var(--gold);margin:36px auto 24px;opacity:.5}
.foot{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.06em}
</style>
</head>
<body>
  <div class="wrap">
    <p class="label">PAGE NOT FOUND</p>
    <p class="code">404</p>
    <h1>お探しのページは見つかりませんでした</h1>
    <p>
      URLが変更された、または削除された可能性があります。<br>
      お手数ですがトップページからお探しください。
    </p>
    <a class="btn" href="/cta-licence-lp/">トップページへ戻る</a>
    <div class="divider"></div>
    <p class="foot">一般社団法人 チアタンブリング協会</p>
  </div>
</body>
</html>
