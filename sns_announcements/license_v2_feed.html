<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>指導ライセンス受験開始 — Feed Post 1080×1350</title>
<style>
  :root {
    --navy: #0a2647;
    --navy-deep: #061a36;
    --gold: #c9a247;
    --gold-light: #e7c97a;
    --crimson: #b91c1c;
    --cream: #f6f1e6;
    --paper: #fbf9f4;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --line: #d8cfb8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    color: var(--ink);
    background: linear-gradient(180deg,
      var(--navy-deep) 0%,
      var(--navy) 30%,
      var(--navy) 42%,
      var(--cream) 46%,
      var(--paper) 100%);
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .canvas {
    width: 1080px; height: 1350px;
    padding: 70px 80px 60px;
    position: relative;
    display: flex; flex-direction: column;
  }

  /* Eyebrow */
  .eyebrow {
    display: inline-flex;
    align-items: center; gap: 12px;
    background: rgba(255,255,255,0.06);
    color: var(--gold-light);
    padding: 12px 26px;
    border-radius: 100px;
    font-family: "Hiragino Sans", sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.04em;
    align-self: center;
    border: 1.5px solid var(--gold);
  }
  .eyebrow .mark {
    width: 22px; height: 22px;
    background: var(--gold);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--navy);
    font-size: 11px;
    font-weight: 900;
    font-family: "Cormorant Garamond", serif;
  }

  /* Hero */
  .hero {
    margin-top: 22px;
    text-align: center;
  }
  .hero .eng {
    font-family: "Cormorant Garamond", serif;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 10px;
    text-indent: 10px;
    font-style: italic;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .hero h1 {
    font-size: 86px;
    font-weight: 900;
    color: white;
    letter-spacing: -0.02em;
    line-height: 1.1;
    text-shadow: 0 4px 24px rgba(0,0,0,0.25);
  }
  .hero h1 .gold-accent {
    color: var(--gold);
  }
  .hero .gold-rule {
    width: 100px;
    height: 2px;
    background: var(--gold);
    margin: 22px auto 18px;
  }
  .hero .sub {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 22px;
    color: rgba(255,255,255,0.9);
    font-weight: 600;
    line-height: 1.65;
  }

  /* Three-up showcase */
  .three {
    margin-top: 28px;
    display: grid;
    grid-template-columns: 1fr 1.1fr 1fr;
    gap: 24px;
    align-items: stretch;
    flex: 1;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-top: 4px solid var(--gold);
    padding: 26px 22px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow: 0 14px 30px rgba(10,38,71,0.18);
    position: relative;
  }
  .card .tag {
    position: absolute;
    top: -14px;
    background: var(--navy);
    color: var(--gold);
    padding: 5px 14px;
    font-family: "Cormorant Garamond", serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    border: 1px solid var(--gold);
  }
  .card .visual {
    flex: 1;
    display: grid;
    place-items: center;
    margin: 18px 0 14px;
    width: 100%;
  }
  .card .visual img {
    max-width: 100%;
    max-height: 240px;
    object-fit: contain;
    filter: drop-shadow(0 8px 20px rgba(10,38,71,0.25));
  }
  .card .title {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 22px;
    color: var(--navy);
    font-weight: 900;
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }
  .card .desc {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    font-weight: 600;
  }

  /* Real book mini cover */
  .mini-book-real {
    width: 150px;
    position: relative;
    transform: rotate(-3deg);
    box-shadow:
      -4px 0 0 var(--gold),
      -5px 0 0 var(--navy-deep),
      10px 14px 26px rgba(10,38,71,0.4);
    border: 1px solid rgba(0,0,0,0.08);
  }
  .mini-book-real img {
    display: block;
    width: 100%;
  }

  /* Footer */
  .footer {
    margin-top: 26px;
    background: var(--navy);
    color: white;
    padding: 22px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid var(--gold);
  }
  .footer .left {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .footer .year {
    font-family: "Cormorant Garamond", serif;
    font-size: 56px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }
  .footer .label {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: white;
    letter-spacing: 0.08em;
  }
  .footer .right {
    text-align: right;
  }
  .footer .right .by {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 11px;
    color: var(--gold-light);
    letter-spacing: 0.1em;
  }
  .footer .right .who {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 15px;
    color: white;
    font-weight: 900;
    margin-top: 4px;
  }

</style>
</head>
<body>
<div class="canvas">

  <div class="eyebrow">
    <span class="mark">C</span>
    一般社団法人 チアタンブリング協会 公式
  </div>

  <div class="hero">
    <div class="eng">LICENSE OPEN</div>
    <h1>チア指導者に、<br>タンブリング、<br><span class="gold-accent">認定</span>を。</h1>
    <div class="gold-rule"></div>
    <div class="sub">チアタンブリング指導ライセンス<br>1級・2級、2027年 受付開始。</div>
  </div>

  <div class="three">
    <div class="card">
      <div class="tag">SEAL</div>
      <div class="visual">
        <img src="cta-mark-level2.png" alt="CTA Certification Mark">
      </div>
      <div class="title">認定マーク</div>
      <div class="desc">取得者に公式マークを<br>発行。指導現場での<br>信頼の証に。</div>
    </div>
    <div class="card">
      <div class="tag">PAMPHLET</div>
      <div class="visual">
        <img src="pdf_extract/pamphlet_cover.png" alt="License Pamphlet">
      </div>
      <div class="title">公式パンフレット</div>
      <div class="desc">2級「止める判断」、<br>1級「進める判断」。<br>カリキュラムと試験要項。</div>
    </div>
    <div class="card">
      <div class="tag">TEXTBOOK</div>
      <div class="visual">
        <div class="mini-book-real">
          <img src="pdf_extract/textbook_cover.png" alt="2級教本 第1巻">
        </div>
      </div>
      <div class="title">公式教本</div>
      <div class="desc">2級 第1巻 完成。<br>1級教本 順次刊行。<br>協会監修。</div>
    </div>
  </div>

  <div class="footer">
    <div class="left">
      <div class="year">2027</div>
      <div class="label">受付開始</div>
    </div>
    <div class="right">
      <div class="by">SUPERVISED BY</div>
      <div class="who">一般社団法人 チアタンブリング協会</div>
    </div>
  </div>

</div>
</body>
</html>
