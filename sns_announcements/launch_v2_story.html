<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>資格制度始動 告知 — Story 1080×1920</title>
<style>
  :root {
    --navy: #0a2647;
    --navy-deep: #061a36;
    --navy-darkest: #04111f;
    --gold: #c9a247;
    --gold-light: #e7c97a;
    --gold-bright: #f5d77a;
    --crimson: #b91c1c;
    --cream: #f6f1e6;
    --paper: #fbf9f4;
    --ink-soft: #c4b894;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    color: white;
    background:
      radial-gradient(ellipse 70% 35% at 50% 0%, rgba(201,162,71,0.20) 0%, transparent 65%),
      radial-gradient(ellipse 60% 30% at 50% 100%, rgba(201,162,71,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 50% 50%, var(--navy-deep) 0%, var(--navy-darkest) 80%);
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: absolute;
    top: -150px; left: 50%;
    transform: translateX(-50%);
    width: 1800px; height: 1800px;
    background:
      conic-gradient(from 90deg at 50% 50%,
        transparent 0deg, rgba(201,162,71,0.04) 10deg, transparent 20deg,
        transparent 35deg, rgba(201,162,71,0.05) 45deg, transparent 55deg,
        transparent 70deg, rgba(201,162,71,0.04) 80deg, transparent 90deg);
    pointer-events: none;
    opacity: 0.7;
  }
  .canvas {
    width: 1080px; height: 1920px;
    padding: 90px 80px 70px;
    position: relative;
    display: flex; flex-direction: column;
    z-index: 1;
  }
  .frame {
    position: absolute;
    top: 40px; left: 40px; right: 40px; bottom: 40px;
    border: 1px solid rgba(201,162,71,0.35);
    pointer-events: none;
  }
  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 60px; height: 60px;
    border: 2px solid var(--gold);
  }
  .frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .frame::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .eyebrow {
    display: inline-flex;
    align-items: center; gap: 12px;
    background: rgba(255,255,255,0.04);
    color: var(--gold-light);
    padding: 13px 28px;
    border-radius: 100px;
    font-family: "Hiragino Sans", sans-serif;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.04em;
    align-self: center;
    border: 1.5px solid var(--gold);
  }
  .eyebrow .mark {
    width: 22px; height: 22px;
    background: var(--gold);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--navy);
    font-size: 11px;
    font-weight: 900;
    font-family: "Cormorant Garamond", serif;
  }

  .hero {
    margin-top: 36px;
    text-align: center;
  }
  .hero .eng {
    font-family: "Cormorant Garamond", serif;
    font-size: 24px;
    color: var(--gold);
    letter-spacing: 14px;
    text-indent: 14px;
    font-style: italic;
    font-weight: 600;
    margin-bottom: 18px;
  }
  .hero h1 {
    font-size: 92px;
    font-weight: 900;
    color: white;
    letter-spacing: -0.01em;
    line-height: 1.12;
    text-shadow: 0 4px 36px rgba(0,0,0,0.45);
  }
  .hero h1 .gold-word {
    color: var(--gold);
    font-style: italic;
  }
  .hero .gold-rule {
    width: 130px;
    height: 2px;
    background: var(--gold);
    margin: 30px auto 22px;
    position: relative;
  }
  .hero .gold-rule::before, .hero .gold-rule::after {
    content: "";
    position: absolute;
    width: 8px; height: 8px;
    background: var(--gold);
    border-radius: 50%;
    top: -3px;
  }
  .hero .gold-rule::before { left: -20px; }
  .hero .gold-rule::after  { right: -20px; }
  .hero .sub {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 26px;
    color: rgba(255,255,255,0.88);
    font-weight: 600;
    line-height: 1.65;
  }

  /* Seal stage */
  .seal-stage {
    flex: 1;
    display: grid;
    place-items: center;
    position: relative;
    margin: 30px 0;
  }
  .seal-glow {
    position: absolute;
    width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(201,162,71,0.28) 0%, transparent 60%);
    z-index: 0;
  }
  .seal-img {
    position: relative;
    width: 480px; height: 480px;
    z-index: 2;
    filter: drop-shadow(0 20px 50px rgba(201,162,71,0.4)) drop-shadow(0 0 80px rgba(201,162,71,0.25));
  }
  .seal-img img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .seal-stage .ribbon-left, .seal-stage .ribbon-right {
    position: absolute;
    z-index: 1;
    top: 50%;
    width: 260px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .seal-stage .ribbon-left  { left: 0; }
  .seal-stage .ribbon-right { right: 0; }

  /* Footer */
  .footer {
    margin-top: 20px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--gold);
    padding: 28px 32px;
    text-align: center;
  }
  .footer .row {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 6px;
  }
  .footer .year {
    font-family: "Cormorant Garamond", serif;
    font-size: 76px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }
  .footer .label {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 28px;
    font-weight: 900;
    color: white;
    letter-spacing: 0.08em;
  }
  .footer .by {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 12px;
    color: var(--gold-light);
    letter-spacing: 0.1em;
    margin-top: 14px;
  }
  .footer .who {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 16px;
    color: white;
    font-weight: 900;
    margin-top: 4px;
  }
  .footer .cta {
    display: inline-block;
    background: var(--gold);
    color: var(--navy-deep);
    padding: 14px 36px;
    margin-top: 18px;
    font-family: "Hiragino Sans", sans-serif;
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 0.04em;
    border-radius: 100px;
  }

  /* START stamp */
  .start-stamp {
    position: absolute;
    top: 90px;
    right: 60px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--gold-bright) 0%, var(--gold) 60%, #9a7726 100%);
    color: var(--navy-deep);
    display: grid;
    place-items: center;
    text-align: center;
    transform: rotate(-12deg);
    box-shadow:
      0 0 0 5px var(--navy-deep),
      0 0 0 9px var(--gold),
      0 14px 32px rgba(0,0,0,0.5);
    z-index: 30;
    padding: 14px;
  }
  .start-stamp .top {
    font-family: "Cormorant Garamond", serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 5px;
    text-indent: 5px;
  }
  .start-stamp .big {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 60px;
    font-weight: 900;
    line-height: 1;
    margin: 4px 0 8px;
    letter-spacing: -2px;
  }
  .start-stamp .bot {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 14px;
    font-weight: 900;
    line-height: 1.3;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="frame"></div>

  <div class="start-stamp">
    <div>
      <div class="top">★ NEW ★</div>
      <div class="big">始動</div>
      <div class="bot">業界初<br>認定制度</div>
    </div>
  </div>

  <div class="eyebrow">
    <span class="mark">C</span>
    一般社団法人 チアタンブリング協会 公式
  </div>

  <div class="hero">
    <div class="eng">OFFICIAL CERTIFICATION SYSTEM</div>
    <h1>チアの<br>タンブリング、<br>指導に<span class="gold-word">資格</span>を。</h1>
    <div class="gold-rule"></div>
    <div class="sub">チアタンブリング指導ライセンス<br>2027年、受付開始。</div>
  </div>

  <div class="seal-stage">
    <div class="seal-glow"></div>
    <div class="ribbon-left"></div>
    <div class="ribbon-right"></div>
    <div class="seal-img">
      <img src="cta-mark-level2.png" alt="CTA Certification Mark">
    </div>
  </div>

  <div class="footer">
    <div class="row">
      <div class="year">2027</div>
      <div class="label">受付開始</div>
    </div>
    <div class="by">SUPERVISED BY</div>
    <div class="who">一般社団法人 チアタンブリング協会</div>
    <br>
    <div class="cta">詳細はプロフィールから →</div>
  </div>
</div>
</body>
</html>
