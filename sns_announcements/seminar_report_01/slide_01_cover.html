<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>講習会レポート Slide 1 — Cover</title>
<style>
  :root {
    --blue-bright: #3B82F6;
    --blue-pop: #60A5FA;
    --blue-mid: #2563EB;
    --blue-deep: #1E3A8A;
    --blue-darkest: #0F1E4D;
    --cyan: #06B6D4;
    --cyan-light: #67E8F9;
    --pink: #EC4899;
    --pink-light: #F472B6;
    --cream: #F0F9FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: "Hiragino Mincho ProN", serif;
    background: var(--blue-darkest);
    color: white;
    -webkit-font-smoothing: antialiased;
  }
  .canvas { width: 1080px; height: 1350px; position: relative; }

  /* Photo area top */
  .photo-area {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 600px;
    overflow: hidden;
  }
  .photo-area img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 55%;
    filter: brightness(1.15) contrast(1.03) saturate(1.08);
  }
  .photo-area::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 0%, transparent 60%, rgba(15,30,77,0.6) 85%, rgba(15,30,77,0.98) 100%);
  }

  /* Body content area */
  .content-bg {
    position: absolute;
    top: 600px; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(59,130,246,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 60% 100% at 50% 100%, rgba(6,182,212,0.18) 0%, transparent 70%),
      var(--blue-darkest);
  }

  /* Frame */
  .frame {
    position: absolute;
    top: 35px; left: 35px; right: 35px; bottom: 35px;
    border: 1px solid rgba(96,165,250,0.45);
    pointer-events: none;
    z-index: 10;
  }
  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 55px; height: 55px;
    border: 2px solid var(--blue-pop);
  }
  .frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .frame::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  /* Top bar */
  .top-bar {
    position: absolute;
    top: 70px; left: 90px; right: 90px;
    z-index: 20;
    display: flex;
    justify-content: center;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center; gap: 12px;
    background: rgba(15,30,77,0.78);
    backdrop-filter: blur(8px);
    color: white;
    padding: 12px 24px;
    border-radius: 100px;
    font-family: "Hiragino Sans", sans-serif;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.04em;
    border: 1.5px solid var(--blue-pop);
  }
  .eyebrow .mark {
    width: 22px; height: 22px;
    background: var(--pink);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: white;
    font-size: 12px;
    font-weight: 900;
    font-family: "Cormorant Garamond", serif;
  }

  /* Stamp */
  .stamp {
    position: absolute;
    top: 60px;
    right: 70px;
    width: 148px; height: 148px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--pink-light) 0%, var(--pink) 60%, #be185d 100%);
    color: white;
    display: grid;
    place-items: center;
    text-align: center;
    transform: rotate(-10deg);
    box-shadow:
      0 0 0 5px var(--blue-darkest),
      0 0 0 8px var(--pink),
      0 14px 32px rgba(0,0,0,0.6);
    z-index: 30;
    padding: 12px;
  }
  .stamp .top {
    font-family: "Cormorant Garamond", serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 4px;
    text-indent: 4px;
  }
  .stamp .big {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 38px;
    font-weight: 900;
    line-height: 1;
    margin: 4px 0;
    letter-spacing: -1px;
  }
  .stamp .bot {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 11px;
    font-weight: 900;
    line-height: 1.3;
  }

  /* Bottom content */
  .content {
    position: absolute;
    top: 600px; left: 0; right: 0; bottom: 0;
    padding: 40px 90px 40px;
    display: flex;
    flex-direction: column;
    z-index: 20;
  }

  /* Series */
  .series {
    text-align: center;
    margin-top: 4px;
  }
  .series .eng {
    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    color: var(--cyan-light);
    letter-spacing: 12px;
    text-indent: 12px;
    font-style: italic;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .series .vol {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
  }
  .series .vol-pre {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--cream);
  }
  .series .vol-num {
    font-family: "Cormorant Garamond", serif;
    font-size: 88px;
    font-weight: 700;
    color: var(--cyan-light);
    line-height: 1;
    font-style: italic;
    text-shadow: 0 4px 18px rgba(103,232,249,0.45);
  }
  .series .vol-suf {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--cream);
  }

  .hero {
    margin-top: 6px;
    text-align: center;
  }
  .hero .pre-title {
    display: inline-block;
    font-family: "Hiragino Sans", sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--cyan-light);
    letter-spacing: 0.08em;
    padding: 9px 26px;
    border: 1px solid var(--cyan);
    background: rgba(6,182,212,0.10);
    margin-bottom: 14px;
  }
  .hero h1 {
    font-size: 58px;
    font-weight: 900;
    color: white;
    letter-spacing: -0.01em;
    line-height: 1.18;
    text-shadow: 0 4px 30px rgba(0,0,0,0.4);
  }
  .hero h1 .accent { color: var(--cyan-light); }
  .gold-rule {
    width: 100px;
    height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--blue-pop));
    margin: 20px auto 16px;
    position: relative;
  }
  .gold-rule::before, .gold-rule::after {
    content: "";
    position: absolute;
    width: 7px; height: 7px;
    background: var(--cyan-light);
    border-radius: 50%;
    top: -2.5px;
  }
  .gold-rule::before { left: -18px; }
  .gold-rule::after  { right: -18px; }
  .hero .sub {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 19px;
    color: rgba(255,255,255,0.88);
    font-weight: 600;
    line-height: 1.65;
  }

  /* Info card */
  .info-card {
    margin: 28px auto 0;
    width: 100%;
    max-width: 820px;
    background: rgba(15,30,77,0.55);
    border: 1px solid rgba(96,165,250,0.5);
    padding: 20px 28px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    gap: 14px;
  }
  .info-card .item {
    text-align: center;
    flex: 1;
  }
  .info-card .item .label {
    font-family: "Cormorant Garamond", serif;
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--cyan-light);
    margin-bottom: 5px;
    font-style: italic;
  }
  .info-card .item .value {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 19px;
    font-weight: 800;
    color: white;
    line-height: 1.3;
  }
  .info-card .divider {
    width: 1px;
    height: 42px;
    background: rgba(96,165,250,0.4);
  }

  /* Footer */
  .footer {
    margin-top: auto;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--blue-pop);
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer .left {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .footer .date {
    font-family: "Cormorant Garamond", serif;
    font-size: 38px;
    font-weight: 700;
    color: var(--cyan-light);
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .footer .right {
    text-align: right;
  }
  .footer .right .by {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 10px;
    color: var(--cyan-light);
    letter-spacing: 0.1em;
  }
  .footer .right .who {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 14px;
    color: white;
    font-weight: 900;
    margin-top: 3px;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="photo-area">
    <img src="カバー.JPG" alt="受講者">
  </div>
  <div class="content-bg"></div>

  <div class="frame"></div>

  <div class="stamp">
    <div>
      <div class="top">★ REPORT ★</div>
      <div class="big">開催</div>
      <div class="bot">指導者<br>講習会</div>
    </div>
  </div>

  <div class="top-bar">
    <div class="eyebrow">
      <span class="mark">C</span>
      一般社団法人 チアタンブリング協会 公式
    </div>
  </div>

  <div class="content">
    <div class="series">
      <div class="eng">SEMINAR REPORT</div>
      <div class="vol">
        <span class="vol-pre">第</span>
        <span class="vol-num">1</span>
        <span class="vol-suf">回</span>
      </div>
    </div>

    <div class="hero">
      <div class="pre-title">チアタンブリング指導資格 2級</div>
      <h1>講習会、<br><span class="accent">開催</span>しました。</h1>
      <div class="gold-rule"></div>
      <div class="sub">チーム講習 開催レポート</div>
    </div>

    <div class="info-card">
      <div class="item">
        <div class="label">FORMAT</div>
        <div class="value">対面・少人数制</div>
      </div>
      <div class="divider"></div>
      <div class="item">
        <div class="label">CONTENT</div>
        <div class="value">講義 + 2級試験</div>
      </div>
      <div class="divider"></div>
      <div class="item">
        <div class="label">THEME</div>
        <div class="value">判断 と 安全</div>
      </div>
    </div>

    <div class="footer">
      <div class="left">
        <div class="date">2026.6.8</div>
      </div>
      <div class="right">
        <div class="by">SUPERVISED BY</div>
        <div class="who">一般社団法人 チアタンブリング協会</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
