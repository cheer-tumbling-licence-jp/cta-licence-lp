<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>資格制度始動 告知 — Feed Post 1080×1350</title>
<style>
  :root {
    --navy: #0a2647;
    --navy-deep: #061a36;
    --navy-darkest: #04111f;
    --gold: #c9a247;
    --gold-light: #e7c97a;
    --gold-bright: #f5d77a;
    --crimson: #b91c1c;
    --cream: #f6f1e6;
    --paper: #fbf9f4;
    --ink-soft: #c4b894;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    color: white;
    background:
      radial-gradient(ellipse 80% 50% at 50% 0%, rgba(201,162,71,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 60% 35% at 50% 100%, rgba(201,162,71,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 50% 50%, var(--navy-deep) 0%, var(--navy-darkest) 80%);
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  /* Decorative rays */
  body::before {
    content: "";
    position: absolute;
    top: -100px; left: 50%;
    transform: translateX(-50%);
    width: 1500px; height: 1500px;
    background:
      conic-gradient(from 90deg at 50% 50%,
        transparent 0deg, rgba(201,162,71,0.04) 10deg, transparent 20deg,
        transparent 35deg, rgba(201,162,71,0.05) 45deg, transparent 55deg,
        transparent 70deg, rgba(201,162,71,0.04) 80deg, transparent 90deg);
    pointer-events: none;
    opacity: 0.7;
  }
  .canvas {
    width: 1080px; height: 1350px;
    padding: 70px 80px 60px;
    position: relative;
    display: flex; flex-direction: column;
    z-index: 1;
  }

  /* Frame border */
  .frame {
    position: absolute;
    top: 35px; left: 35px; right: 35px; bottom: 35px;
    border: 1px solid rgba(201,162,71,0.35);
    pointer-events: none;
  }
  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 50px; height: 50px;
    border: 2px solid var(--gold);
  }
  .frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .frame::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  /* Top eyebrow */
  .eyebrow {
    display: inline-flex;
    align-items: center; gap: 12px;
    background: rgba(255,255,255,0.04);
    color: var(--gold-light);
    padding: 12px 26px;
    border-radius: 100px;
    font-family: "Hiragino Sans", sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.04em;
    align-self: center;
    border: 1.5px solid var(--gold);
  }
  .eyebrow .mark {
    width: 22px; height: 22px;
    background: var(--gold);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--navy);
    font-size: 11px;
    font-weight: 900;
    font-family: "Cormorant Garamond", serif;
  }

  /* Hero */
  .hero {
    margin-top: 28px;
    text-align: center;
  }
  .hero .eng {
    font-family: "Cormorant Garamond", serif;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 12px;
    text-indent: 12px;
    font-style: italic;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .hero h1 {
    font-size: 102px;
    font-weight: 900;
    color: white;
    letter-spacing: -0.01em;
    line-height: 1.08;
    text-shadow: 0 4px 30px rgba(0,0,0,0.4);
  }
  .hero h1 .gold-word {
    color: var(--gold);
    font-style: italic;
  }
  .hero .gold-rule {
    width: 110px;
    height: 2px;
    background: var(--gold);
    margin: 26px auto 18px;
    position: relative;
  }
  .hero .gold-rule::before, .hero .gold-rule::after {
    content: "";
    position: absolute;
    width: 7px; height: 7px;
    background: var(--gold);
    border-radius: 50%;
    top: -2.5px;
  }
  .hero .gold-rule::before { left: -18px; }
  .hero .gold-rule::after  { right: -18px; }
  .hero .sub {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 22px;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    line-height: 1.65;
  }

  /* Seal showcase center */
  .seal-stage {
    flex: 1;
    display: grid;
    place-items: center;
    position: relative;
    margin: 8px 0;
  }
  .seal-glow {
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(201,162,71,0.28) 0%, transparent 60%);
    z-index: 0;
  }
  .seal-img {
    position: relative;
    width: 360px; height: 360px;
    z-index: 2;
    filter: drop-shadow(0 18px 40px rgba(201,162,71,0.4)) drop-shadow(0 0 60px rgba(201,162,71,0.25));
  }
  .seal-img img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .seal-stage .ribbon-left, .seal-stage .ribbon-right {
    position: absolute;
    z-index: 1;
    top: 50%;
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .seal-stage .ribbon-left  { left: 10px; }
  .seal-stage .ribbon-right { right: 10px; }

  /* Footer */
  .footer {
    margin-top: 10px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--gold);
    padding: 22px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer .left {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .footer .year {
    font-family: "Cormorant Garamond", serif;
    font-size: 60px;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .footer .label {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: white;
    letter-spacing: 0.08em;
  }
  .footer .right {
    text-align: right;
  }
  .footer .right .by {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 11px;
    color: var(--gold-light);
    letter-spacing: 0.1em;
  }
  .footer .right .who {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 15px;
    color: white;
    font-weight: 900;
    margin-top: 4px;
  }

  /* START stamp */
  .start-stamp {
    position: absolute;
    top: 70px;
    right: 70px;
    width: 170px; height: 170px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--gold-bright) 0%, var(--gold) 60%, #9a7726 100%);
    color: var(--navy-deep);
    display: grid;
    place-items: center;
    text-align: center;
    transform: rotate(-12deg);
    box-shadow:
      0 0 0 5px var(--navy-deep),
      0 0 0 8px var(--gold),
      0 14px 32px rgba(0,0,0,0.5);
    z-index: 30;
    padding: 12px;
  }
  .start-stamp .top {
    font-family: "Cormorant Garamond", serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 4px;
    text-indent: 4px;
  }
  .start-stamp .big {
    font-family: "Hiragino Mincho ProN", serif;
    font-size: 50px;
    font-weight: 900;
    line-height: 1;
    margin: 4px 0 4px;
    letter-spacing: -2px;
  }
  .start-stamp .bot {
    font-family: "Hiragino Sans", sans-serif;
    font-size: 13px;
    font-weight: 900;
    line-height: 1.3;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="frame"></div>

  <div class="start-stamp">
    <div>
      <div class="top">★ NEW ★</div>
      <div class="big">始動</div>
      <div class="bot">業界初<br>認定制度</div>
    </div>
  </div>

  <div class="eyebrow">
    <span class="mark">C</span>
    一般社団法人 チアタンブリング協会 公式
  </div>

  <div class="hero">
    <div class="eng">OFFICIAL CERTIFICATION SYSTEM</div>
    <h1>指導が、<br><span class="gold-word">認定</span>される<br>時代へ。</h1>
    <div class="gold-rule"></div>
    <div class="sub">チアタンブリング指導ライセンス<br>2027年、受付開始。</div>
  </div>

  <div class="seal-stage">
    <div class="seal-glow"></div>
    <div class="ribbon-left"></div>
    <div class="ribbon-right"></div>
    <div class="seal-img">
      <img src="cta-mark-level2.png" alt="CTA Certification Mark">
    </div>
  </div>

  <div class="footer">
    <div class="left">
      <div class="year">2027</div>
      <div class="label">受付開始</div>
    </div>
    <div class="right">
      <div class="by">SUPERVISED BY</div>
      <div class="who">一般社団法人 チアタンブリング協会</div>
    </div>
  </div>
</div>
</body>
</html>
